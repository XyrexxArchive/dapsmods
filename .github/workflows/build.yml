name: Android Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi
          CORE="${VERSION%%-*}"
          CORE="${CORE%%+*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle --no-daemon assembleRelease -PappVersion="${{ steps.release.outputs.name }}" -PappVersionCode="${{ steps.release.outputs.code }}"

      - name: Prepare APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "release/DapsMods-${{ steps.release.outputs.name }}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DapsMods ${{ steps.release.outputs.name }}
          generate_release_notes: true
          files: release/DapsMods-${{ steps.release.outputs.name }}.apk

      - name: Build debug APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gradle --no-daemon assembleDebug

      - name: Upload debug artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DapsMods-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
